name: Frontend CI

# Lint, unit/component tests, a production build and the Playwright browser tests on every
# pull request and push to main that touches the frontend. No secrets or backend needed:
# browser tests answer API calls with a fake (frontend/e2e/fakeApi.js).
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs Node 22.12+ (package.json engines); 22 is the oldest supported.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Fails on high or critical advisories in runtime dependencies.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
