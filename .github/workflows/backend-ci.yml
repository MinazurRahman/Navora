name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: navora
          POSTGRES_PASSWORD: navora_ci_password
          POSTGRES_DB: navora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U navora -d navora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database. Upstash is replaced by placeholders (see vitest.config.js),
      # so the real-Upstash test skips itself and no secrets are needed.
      TEST_DATABASE_URL: postgres://navora:navora_ci_password@localhost:5432/navora_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # oldest supported version (package.json engines)
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
