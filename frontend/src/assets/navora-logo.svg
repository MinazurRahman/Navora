<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Official NAVORA logo. Only change from the supplied asset: the wordmark rendered
       "NAVORAA" (full word plus a gradient A); it now reads NAVOR + gradient A. -->
  <defs>
    <linearGradient id="trailGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g transform="translate(100, 75)">
    <path d="M -60,0 C -60,40 -20,40 0,0 C 20,-40 60,-40 60,0 L 60,40 L 40,40 L 40,10 C 40,-20 10,-20 0,-10 C -10,0 -40,10 -40,-10 Z" fill="url(#trailGradient)" stroke="none" />
    <path d="M 0,-45 L 7,-30 L 0,-15 L -7,-30 Z" fill="#1E3A8A" />
  </g>

  <text x="100" y="160" font-family="Montserrat, Inter, sans-serif" font-weight="700" font-size="28" text-anchor="middle" fill="#1E3A8A">
    NAVOR<tspan fill="url(#trailGradient)">A</tspan>
  </text>
</svg>
