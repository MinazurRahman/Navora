# Local development database: PostgreSQL 17 + PostGIS.
# Port 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432.
# The credentials below are for local development only.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: navora
      POSTGRES_PASSWORD: navora_dev_password
      POSTGRES_DB: navora
    ports:
      - "5433:5432"
    volumes:
      - navora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navora -d navora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  navora-pgdata:
